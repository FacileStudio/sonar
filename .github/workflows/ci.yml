name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sonar
          POSTGRES_PASSWORD: sonar
          POSTGRES_DB: sonar_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://sonar:sonar@127.0.0.1:5432/sonar_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: tests
        run: go test -count=1 ./...

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build

  douane:
    runs-on: ubuntu-latest
    env:
      DOUANE_VERSION: 0.7.1
      DOUANE_SHA256: 4f82ffbe1dc02aaf2ea0e7952c35066f9bef486a85fe5e21c53b253c45f33e57
    steps:
      - uses: actions/checkout@v7

      - name: install douane
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          archive="douane_${DOUANE_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/FacileStudio/douane/releases/download/v${DOUANE_VERSION}/$archive"
          echo "${DOUANE_SHA256}  $archive" | sha256sum -c -
          tar xzf "$archive" douane
          ./douane --version

      - name: scan
        run: |
          "$RUNNER_TEMP/douane" scan -fail critical -scope prod .
