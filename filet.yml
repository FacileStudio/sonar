# sonar's coding standard, enforced by filet.
# https://github.com/FacileStudio/filet
#
#   filet check .     the rules
#   filet roast .     the rules, with commentary
#
# The suite preset, plus what a Go CLI that also serves sonar.facile.studio
# needs: the CLI layout (cmd, internal) instead of apps/api, and cobra's
# idiomatic `var cmd` + `init()`. Lists replace the preset's, so they are
# restated in full.

preset: facile

kind: cli

ignore:
  - .git
  - node_modules
  - vendor
  - dist
  - build
  - testdata
  - coverage

extensions: [.go]

architecture:
  requiredDirs: [cmd, internal]
  requiredFiles:
    "internal/config": [config.go]
    # A server module owns HTTP and declares it in router.go, the suite's
    # module convention. Packages with no routes live beside modules/.
    "internal/server/modules/*": [router.go]

style:
  banInit: false
  banGlobalMutable: false
